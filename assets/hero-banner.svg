<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#070a12"/>
      <stop offset="55%" stop-color="#0b111e"/>
      <stop offset="100%" stop-color="#0a1618"/>
    </linearGradient>
    <radialGradient id="emeraldGlow" cx="76%" cy="50%" r="38%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="roseGlow" cx="90%" cy="22%" r="28%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGuard" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="barRose" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="barEmerald" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="barAmber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#94a3b8" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Main Card -->
  <rect x="2" y="2" width="1196" height="336" rx="22" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="2" y="2" width="1196" height="336" rx="22" fill="url(#grid)"/>
  <rect x="2" y="2" width="1196" height="336" rx="22" fill="url(#emeraldGlow)"/>
  <rect x="2" y="2" width="1196" height="336" rx="22" fill="url(#roseGlow)"/>

  <!-- Left Title Block -->
  <g transform="translate(72, 74)">
    <!-- Shield Icon -->
    <g transform="translate(0, 6)">
      <path d="M22 2L40 10V22C40 33.2 32.2 42 22 45.5C11.8 42 4 33.2 4 22V10L22 2Z" fill="rgba(16,185,129,0.14)" stroke="#34d399" stroke-width="2.4" filter="url(#glow)"/>
      <path d="M14 24L19.5 29.5L30.5 18" stroke="#6ee7b7" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Title -->
    <text x="62" y="45" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="54" font-weight="800" letter-spacing="-1">
      <tspan fill="#f1f5f9">Sub</tspan><tspan fill="url(#titleGuard)">Guard</tspan>
    </text>

    <!-- Tagline -->
    <text x="2" y="92" fill="#cbd5e1" font-family="JetBrains Mono, Consolas, monospace" font-size="18.5" font-weight="500">
      Private X-ray for hidden subscriptions &amp; money leaks.
    </text>

    <!-- Subline -->
    <text x="2" y="122" fill="#64748b" font-family="JetBrains Mono, Consolas, monospace" font-size="14">
      Zero-Upload CSP · Global Banks (CSV / PDF / Ctrl+V) · Trap Radar · Leak Receipt
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 154)" font-family="JetBrains Mono, Consolas, monospace" font-size="13" font-weight="600">
      <rect x="0" y="0" width="142" height="34" rx="9" fill="#0d261f" stroke="#10b981" stroke-opacity="0.5"/>
      <circle cx="18" cy="17" r="4" fill="#34d399"/>
      <text x="30" y="22" fill="#6ee7b7">0 Bytes Sent</text>

      <rect x="154" y="0" width="132" height="34" rx="9" fill="#27141c" stroke="#f43f5e" stroke-opacity="0.5"/>
      <text x="171" y="22" fill="#fda4af">⚡ Trap Radar</text>

      <rect x="298" y="0" width="142" height="34" rx="9" fill="#251d10" stroke="#f59e0b" stroke-opacity="0.5"/>
      <text x="315" y="22" fill="#fcd34d">▲ Price Hikes</text>

      <rect x="452" y="0" width="102" height="34" rx="9" fill="#131c2e" stroke="#38bdf8" stroke-opacity="0.45"/>
      <text x="470" y="22" fill="#7dd3fc">EN / RU</text>
    </g>
  </g>

  <!-- Right Side Vector Graphic (Radar + Burn/Savings Bars) -->
  <g transform="translate(780, 42)">
    <!-- Radar Rings -->
    <circle cx="195" cy="128" r="118" stroke="#10b981" stroke-opacity="0.14" stroke-width="1.2" stroke-dasharray="4 6"/>
    <circle cx="195" cy="128" r="82" stroke="#10b981" stroke-opacity="0.22" stroke-width="1.2"/>
    <circle cx="195" cy="128" r="46" stroke="#34d399" stroke-opacity="0.3" stroke-width="1.2"/>

    <!-- Connecting Scanning Rays -->
    <line x1="65" y1="185" x2="195" y2="128" stroke="#34d399" stroke-opacity="0.35" stroke-width="1.2"/>
    <line x1="312" y1="62" x2="195" y2="128" stroke="#fb7185" stroke-opacity="0.45" stroke-width="1.4"/>
    <line x1="322" y1="192" x2="195" y2="128" stroke="#fbbf24" stroke-opacity="0.4" stroke-width="1.2"/>

    <!-- Mini Burn & Savings Bars Card -->
    <rect x="92" y="68" width="206" height="122" rx="14" fill="#0d1322" fill-opacity="0.92" stroke="#334155" stroke-width="1.2"/>
    <text x="110" y="92" fill="#94a3b8" font-family="JetBrains Mono, Consolas, monospace" font-size="11" font-weight="600">12-MO BURN / SAVED</text>

    <!-- Bars -->
    <rect x="112" y="128" width="16" height="44" rx="4" fill="url(#barRose)"/>
    <rect x="136" y="114" width="16" height="58" rx="4" fill="url(#barRose)"/>
    <rect x="160" y="122" width="16" height="50" rx="4" fill="url(#barAmber)"/>
    <rect x="184" y="106" width="16" height="66" rx="4" fill="url(#barRose)"/>
    <rect x="208" y="138" width="16" height="34" rx="4" fill="url(#barRose)"/>
    <rect x="208" y="108" width="16" height="27" rx="4" fill="url(#barEmerald)"/>
    <rect x="232" y="142" width="16" height="30" rx="4" fill="url(#barRose)"/>
    <rect x="232" y="104" width="16" height="35" rx="4" fill="url(#barEmerald)"/>
    <rect x="256" y="144" width="16" height="28" rx="4" fill="url(#barRose)"/>
    <rect x="256" y="98" width="16" height="43" rx="4" fill="url(#barEmerald)"/>

    <!-- Floating Alert Nodes -->
    <g transform="translate(274, 38)">
      <rect x="0" y="0" width="90" height="28" rx="8" fill="#27141c" stroke="#f43f5e" stroke-width="1.2"/>
      <text x="12" y="18" fill="#fda4af" font-family="JetBrains Mono, Consolas, monospace" font-size="11" font-weight="700">▲ +18% HIKE</text>
    </g>

    <g transform="translate(24, 196)">
      <rect x="0" y="0" width="112" height="28" rx="8" fill="#0d261f" stroke="#10b981" stroke-width="1.2"/>
      <text x="12" y="18" fill="#6ee7b7" font-family="JetBrains Mono, Consolas, monospace" font-size="11" font-weight="700">✓ 0 BYTES OUT</text>
    </g>

    <g transform="translate(268, 198)">
      <rect x="0" y="0" width="100" height="28" rx="8" fill="#251d10" stroke="#f59e0b" stroke-width="1.2"/>
      <text x="11" y="18" fill="#fcd34d" font-family="JetBrains Mono, Consolas, monospace" font-size="11" font-weight="700">! $1 TRIAL</text>
    </g>
  </g>
</svg>
